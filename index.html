  await commitOps(ops, { action: 'update', entity: 'member', summary: 'メンバーの表示順を変更：' + domIds.map(memberName).join(' → ') });
}

const MEMBER_FIELDS = ['name', 'email', 'color', 'role', 'active'];
const loginableAdmins = list => list.filter(m => m.active !== false && memberIsAdmin(m) && m.email);

async function saveMember(id, input) {
  const old = id ? memberById(id) : null;
  const name = input.name.trim(), email = input.email.trim().toLowerCase();
  if (!name) throw new UserError('表示名を入力してください');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new UserError('メールアドレスの形式が正しくありません');
  if (email && S.members.some(m => m.id !== id && m.email === email)) throw new UserError('このメールアドレスは別のメンバーに登録されています');
  if (email && input.active && S.viewers.some(v => v.email === email)) throw new UserError('このメールアドレスは閲覧者として登録されています。先に閲覧者から削除してください');
  const data = { name, email, color: input.color, role: input.isAdmin ? 'admin' : 'member', active: !!input.active };

  // 管理者が0人になる変更（最後の管理者の権限解除・非表示・メール削除）は不可
  if (old) {
    const after = S.members.map(m => m.id === id ? { ...m, ...data } : m);
    if (loginableAdmins(S.members).length && !loginableAdmins(after).length)
      throw new UserError('管理者が1人もいなくなるため、この変更はできません。先に別のメンバーを管理者にしてください。');
  }
  if (old && old.email === S.email) {
    if (email !== S.email && !confirm('ご自身のメールアドレスを変更すると、現在のアカウントではログインできなくなります。続けますか？')) return false;
    if (!data.active && !confirm('ご自身を非表示にすると、ログインできなくなります。続けますか？')) return false;
    if (memberIsAdmin(old) && data.role !== 'admin' && !confirm('ご自身の管理者権限を外すと、設定を変更できなくなります。続けますか？')) return false;
  }

  const ref = old ? doc(db, 'members', id) : doc(collection(db, 'members'));
  const ops = [{ type: 'set', ref, merge: true, data: { ...data, isAdmin: deleteField(), ...(old ? {} : { order: Math.max(0, ...S.members.map(m => m.order || 0)) + 1, createdAt: serverTimestamp() }), updatedAt: serverTimestamp() } }];
  // allowedUsers（ログイン許可）を members と同時に更新。メール変更時は旧ドキュメント削除＋新規作成
  const oldKey = old && old.active !== false && old.email ? old.email : null;
  const newKey = data.active && email ? email : null;
  if (oldKey && oldKey !== newKey) ops.push({ type: 'delete', ref: doc(db, 'allowedUsers', oldKey) });
  if (newKey) ops.push({ type: 'set', ref: doc(db, 'allowedUsers', newKey), data: { memberId: ref.id, role: data.role, name } });

  const pick = m => Object.fromEntries(MEMBER_FIELDS.map(k => [k, k === 'role' ? roleOf(m) : m[k] ?? (k === 'active' ? true : '')]));
  await commitOps(ops, { action: old ? 'update' : 'create', entity: 'member', summary: `メンバーを${old ? '変更' : '追加'}：${name}`, docIds: [ref.id], before: old ? pick(old) : null, after: data });
  toast(old ? 'メンバー情報を更新しました' : 'メンバーを追加しました');
  return true;
}

async function toggleMemberActive(m) {
  const toActive = m.active === false;
  if (!toActive && !confirm(`${m.name} さんを非表示にしますか？\n過去の記録は残りますが、一覧に表示されなくなり、ログインもできなくなります。`)) return;
  await saveMember(m.id, { ...m, email: m.email || '', isAdmin: memberIsAdmin(m), active: toActive });
}

function openMemberDialog(m) {
  const isNew = !m;
  const used = S.members.map(x => x.color);
  m = m || { name: '', email: '', color: MEMBER_COLORS.find(c => !used.includes(c)) || MEMBER_COLORS[S.members.length % MEMBER_COLORS.length], role: 'member', active: true };
  openDialog(`<form class="form" id="memForm" novalidate>
    <h3>${isNew ? 'メンバーの追加' : 'メンバーの編集'}</h3>
    <div class="row"><label>表示名</label><div class="fld"><input type="text" name="name" maxlength="30" value="${esc(m.name)}" required autofocus></div></div>
    <div class="row"><label>メール</label><div class="fld"><input type="email" name="email" maxlength="200" value="${esc(m.email || '')}" placeholder="社内メールアドレス">
      <p class="hint">このアドレスで「初回登録」（パスワード設定とメール確認）をすると、ログインできるようになります。変更すると、ログイン許可も新しいアドレスに切り替わります（新しいアドレスでの初回登録が必要です）。</p></div></div>
    <div class="row"><label>表示色</label><div class="fld swatches"><input type="color" name="color" value="${m.color}">${MEMBER_COLORS.map(c => `<button type="button" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div></div>
    <div class="row"><label>権限</label><div class="fld"><label class="inline"><input type="checkbox" name="isAdmin" ${memberIsAdmin(m) ? 'checked' : ''}> 管理者（メンバー・設定を編集できる）</label></div></div>
    <div class="row"><label>表示</label><div class="fld"><label class="inline"><input type="checkbox" name="active" ${m.active !== false ? 'checked' : ''}> カレンダーに表示する（外すと非表示・ログイン不可）</label></div></div>
    <p class="error"></p>
    <div class="actions"><span class="spacer"></span><button type="button" data-close>キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>`);
  const f = $('#memForm'), E = f.elements;
  $$('[data-color]', f).forEach(b => b.addEventListener('click', () => { E.color.value = b.dataset.color; }));
  f.addEventListener('submit', e => {
    e.preventDefault();
    guarded(f, () => saveMember(isNew ? null : m.id, { name: E.name.value, email: E.email.value, color: E.color.value, isAdmin: E.isAdmin.checked, active: E.active.checked }));
  });
}

// ---------- 閲覧者 ----------
function settingsViewers() {
  const list = [...S.viewers].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  return `<div class="tab-head"><button class="primary" data-act="viewer-add">＋ 閲覧者を追加</button></div>
    <p class="hint">閲覧者は記録の閲覧・絞り込み・印刷・CSV出力のみできます（記録の登録・編集、設定、編集履歴は利用できません）。一覧の列には表示されません。<br>削除するとログインできなくなります。登録後、本人に「初回登録」をしてもらってください。</p>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl" style="max-width:760px"><thead><tr><th>表示名</th><th>メールアドレス</th><th></th></tr></thead><tbody>${list.map(v =>
      `<tr><td>${esc(v.name)}<span class="badge view-only">閲覧者</span></td><td>${esc(v.email)}</td><td class="act"><button class="small" data-act="viewer-edit" data-id="${v.id}">編集</button> <button class="small danger" data-act="viewer-del" data-id="${v.id}">削除</button></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">登録されている閲覧者はいません。</p>'}`;
}
function openViewerDialog(v) {
  const isNew = !v;
  v = v || { name: '', email: '' };
  openDialog(`<form class="form" id="viewerForm" novalidate>
    <h3>${isNew ? '閲覧者の追加' : '閲覧者の編集'}</h3>
    <div class="row"><label>表示名</label><div class="fld"><input type="text" name="name" maxlength="30" value="${esc(v.name)}" required autofocus></div></div>
    <div class="row"><label>メール</label><div class="fld"><input type="email" name="email" maxlength="200" value="${esc(v.email)}" placeholder="社内メールアドレス" required>
      <p class="hint">このアドレスで「初回登録」をすると、閲覧専用でログインできるようになります。変更すると、ログイン許可も新しいアドレスに切り替わります。</p></div></div>
    <p class="error"></p>
    <div class="actions"><span class="spacer"></span><button type="button" data-close>キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>`);
  const f = $('#viewerForm');
  f.addEventListener('submit', e => { e.preventDefault(); guarded(f, () => saveViewer(isNew ? null : v, f.elements.name.value, f.elements.email.value)); });
}
async function saveViewer(old, nameIn, emailIn) {
  const name = nameIn.trim(), email = emailIn.trim().toLowerCase();
  if (!name) throw new UserError('表示名を入力してください');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new UserError('メールアドレスを正しく入力してください');
  // 非表示のメンバーのアドレスは閲覧者に使える（そのメンバーの再表示は saveMember 側で止まる）
  if (S.members.some(m => m.active !== false && m.email === email)) throw new UserError('このメールアドレスはメンバーとして登録されています');
  if (S.viewers.some(x => x.id !== old?.id && x.email === email)) throw new UserError('このメールアドレスは別の閲覧者に登録されています');
  const ref = old ? doc(db, 'viewers', old.id) : doc(collection(db, 'viewers'));
  const ops = [{ type: 'set', ref, merge: true, data: { name, email, ...(old ? {} : { createdAt: serverTimestamp() }), updatedAt: serverTimestamp() } }];
  // ログイン許可（allowedUsers）を同時に更新。メール変更時は旧ドキュメント削除＋新規作成
  if (old && old.email !== email) ops.push({ type: 'delete', ref: doc(db, 'allowedUsers', old.email) });
  ops.push({ type: 'set', ref: doc(db, 'allowedUsers', email), data: { viewerId: ref.id, role: 'viewer', name } });
  await commitOps(ops, { action: old ? 'update' : 'create', entity: 'viewer', summary: `閲覧者を${old ? '変更' : '追加'}：${name}`, docIds: [ref.id], before: old ? { name: old.name, email: old.email } : null, after: { name, email } });
  toast(old ? '閲覧者を更新しました' : '閲覧者を追加しました');
  return true;
}
async function deleteViewer(v) {
  if (!v || !confirm(`閲覧者「${v.name}」を削除しますか？\n削除するとログインできなくなります。`)) return;
  await commitOps([{ type: 'delete', ref: doc(db, 'viewers', v.id) }, { type: 'delete', ref: doc(db, 'allowedUsers', v.email) }],
    { action: 'delete', entity: 'viewer', summary: `閲覧者を削除：${v.name}`, docIds: [v.id], before: { name: v.name, email: v.email } });
  toast('閲覧者を削除しました');
}

// ---------- 旧形式（isAdmin）から役割（role）への移行 ----------
const legacyMembers = () => S.members.filter(m => !m.role);
const needsMigration = () => S.legacyAllowed.length > 0 || legacyMembers().length > 0;
async function checkMigration() {
  try { S.legacyAllowed = docsOf(await getDocs(collection(db, 'allowedUsers'))).filter(d => !d.role); renderAll(); }
  catch (e) { console.warn(e); }
}
async function runMigration() {
  await checkMigration();
  const ops = [
    ...S.legacyAllowed.map(d => ({ type: 'update', ref: doc(db, 'allowedUsers', d.id), data: { role: d.isAdmin === true ? 'admin' : 'member', isAdmin: deleteField() } })),
    ...legacyMembers().map(m => ({ type: 'update', ref: doc(db, 'members', m.id), data: { role: m.isAdmin === true ? 'admin' : 'member', isAdmin: deleteField() } })),
  ];
  if (!ops.length) { toast('移行が必要なデータはありません'); return; }
  if (!confirm(`${ops.length}件の権限データを役割（role）形式に移行します。よろしいですか？`)) return;
  await commitOps(ops, { action: 'update', entity: 'config', summary: `権限データを役割（role）形式に移行（${ops.length}件）` });
  toast('移行が完了しました');
  await checkMigration();
}

// ---------- 時間帯 ----------
function settingsTime() {
  const sl = S.config.slots;
  const pair = (k, label) => `<span>${label}</span><span><input type="time" name="${k}_start" value="${sl[k].start}" step="300" required> 〜 <input type="time" name="${k}_end" value="${sl[k].end}" step="300" required></span>`;
  return `<form id="timeForm" novalidate><h3>時間帯</h3><p class="hint">記録は「午前」「午後」の区分で管理します。ここで設定した時刻は画面上の表示に使われます。</p>
    <div class="time-grid">${pair('am', '午前')}${pair('lunch', '昼休み')}${pair('pm', '午後')}</div>
    <p class="error"></p><button type="submit" class="primary">保存</button></form>`;
}
async function saveTimes(f) {
  const E = f.elements;
  const slots = {};
  for (const k of ['am', 'lunch', 'pm']) {
    slots[k] = { start: E[k + '_start'].value, end: E[k + '_end'].value };
    if (!slots[k].start || !slots[k].end || slots[k].start >= slots[k].end) throw new UserError('開始時刻は終了時刻より前にしてください');
  }
  if (slots.am.end > slots.lunch.start || slots.lunch.end > slots.pm.start) throw new UserError('午前 → 昼休み → 午後 の順になるように設定してください');
  await commitOps([{ type: 'update', ref: cfgRef(), data: { slots, ...stampUpd() } }], { action: 'update', entity: 'config', summary: '時間帯の設定を変更', before: { slots: S.config.slots }, after: { slots } });
  toast('時間帯を保存しました');
}

// ---------- 種別 ----------
const catRow = c => `<tr data-cat="${c.id}"><td><span class="drag-handle">≡</span></td><td><input type="color" name="color" value="${c.color}"></td>
  <td><input type="text" name="name" maxlength="20" value="${esc(c.name)}"></td>
  <td style="text-align:center"><input type="checkbox" name="abs" ${c.isAbsence ? 'checked' : ''}></td>
  <td style="text-align:center"><input type="checkbox" name="hidden" ${c.hidden ? 'checked' : ''}></td></tr>`;
function settingsCats() {
  return `<form id="catForm" novalidate><h3>種別</h3><p class="hint">「不在扱い」にした種別は、トップの「今日の不在者」に表示されます。「使わない」にすると入力画面の選択肢から外れます（過去の記録はそのまま表示されます）。≡ をドラッグで並べ替えできます。</p>
    <div class="tbl-wrap"><table class="tbl" style="max-width:640px"><thead><tr><th style="width:2rem"></th><th style="width:4rem">色</th><th>種別名</th><th style="width:6rem;text-align:center">不在扱い</th><th style="width:6rem;text-align:center">使わない</th></tr></thead>
    <tbody id="catBody">${cats().map(catRow).join('')}</tbody></table></div>
    <p><button type="button" data-act="cat-add">＋ 種別を追加</button></p><p class="error"></p><button type="submit" class="primary">保存</button></form>`;
}
function addCatRow() {
  $('#catBody').insertAdjacentHTML('beforeend', catRow({ id: 'c' + Date.now().toString(36), name: '', color: '#6b7a8c', isAbsence: false, hidden: false }));
  $('#catBody tr:last-child input[name=name]').focus();
}
async function saveCats(f) {
  const list = $$('tr[data-cat]', f).map((r, i) => ({
    id: r.dataset.cat, name: $('[name=name]', r).value.trim(), color: $('[name=color]', r).value,
    isAbsence: $('[name=abs]', r).checked, hidden: $('[name=hidden]', r).checked, order: i + 1,
  }));
  if (list.some(c => !c.name)) throw new UserError('種別名を入力してください');
  if (new Set(list.map(c => c.name)).size !== list.length) throw new UserError('同じ名前の種別があります');
  await commitOps([{ type: 'update', ref: cfgRef(), data: { categories: list, ...stampUpd() } }], { action: 'update', entity: 'config', summary: '種別の設定を変更', before: { categories: S.config.categories }, after: { categories: list } });
  toast('種別を保存しました');
}

// ---------- 会社休日 ----------
function settingsHolidays() {
  const list = [...S.config.companyHolidays].sort((a, b) => a.date.localeCompare(b.date));
  return `<h3>会社休日</h3><p class="hint">日本の祝日（振替休日・国民の休日を含む）は自動で判定します。ここでは年末年始・夏季休業など会社独自の休日を登録します。</p>
    <form id="holForm" class="tab-head" novalidate><input type="date" name="date" required><input type="text" name="name" maxlength="30" placeholder="名称（例：年末年始休業）" style="max-width:260px"><button type="submit" class="primary">追加</button><p class="error" style="margin:0"></p></form>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl" style="max-width:560px;margin-top:.8rem"><thead><tr><th>日付</th><th>名称</th><th></th></tr></thead><tbody>${list.map(h => `<tr><td>${fmtYMD(h.date)}</td><td>${esc(h.name)}</td><td class="act"><button class="small danger" data-act="hol-del" data-date="${h.date}">削除</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">登録されている会社休日はありません。</p>'}`;
}
async function addCompanyHoliday(f) {
  const date = f.elements.date.value, name = f.elements.name.value.trim() || '会社休日';
  if (!date) throw new UserError('日付を入力してください');
  if (S.config.companyHolidays.some(h => h.date === date)) throw new UserError('その日はすでに登録されています');
  const list = [...S.config.companyHolidays, { date, name }].sort((a, b) => a.date.localeCompare(b.date));
  await commitOps([{ type: 'update', ref: cfgRef(), data: { companyHolidays: list, ...stampUpd() } }], { action: 'update', entity: 'config', summary: `会社休日を追加：${fmtYMD(date)} ${name}` });
  toast('会社休日を追加しました');
}
async function removeCompanyHoliday(date) {
  const h = S.config.companyHolidays.find(x => x.date === date);
  if (!h || !confirm(`${fmtYMD(date)} ${h.name} を削除しますか？`)) return;
  const list = S.config.companyHolidays.filter(x => x.date !== date);
  await commitOps([{ type: 'update', ref: cfgRef(), data: { companyHolidays: list, ...stampUpd() } }], { action: 'delete', entity: 'config', summary: `会社休日を削除：${fmtYMD(date)} ${h.name}` });
}

// =====================================================================
//  CSV出力（UTF-8 BOM付き）
// =====================================================================
function exportCsv() {
  const { start, end } = viewRange();
  let days = new Set(dateRange(start, end));
  if (S.view === 'week' && !S.showWeekend) days = new Set([...days].filter(d => { const w = parseYmd(d).getDay(); return w !== 0 && w !== 6; }));
  const vis = visibleMembers();
  const visIds = new Set(vis.map(m => m.id));
  const order = id => memberById(id)?.order ?? 999;
  const list = S.events.filter(e => days.has(e.date) && visIds.has(e.targetId) && passCat(e))
    .sort((a, b) => a.date.localeCompare(b.date) || SLOT_RANK[a.slot] - SLOT_RANK[b.slot] || order(a.targetId) - order(b.targetId) || cmpEvent(a, b));
  const cell = v => {
    let s = String(v ?? '');
    if (/^[=+\-@]/.test(s)) s = "'" + s; // 数式として解釈されないように
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [['日付', '曜日', '区分', 'メンバー', '種別', '実施内容', '場所', '関連テーマ', '記録／予定', '更新者', '更新日時']];
  for (const e of list) {
    const d = parseYmd(e.date);
    rows.push([`${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`, WD[d.getDay()], SLOT_LABEL[e.slot], memberName(e.targetId), catName(e.category),
      e.title, e.location, e.theme, isPlanDate(e.date) ? '予定' : '記録', e.updatedByName || e.updatedBy || '', fmtTs(e.updatedAt)]);
  }
  const csv = '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = S.view === 'day' ? `業務記録_${start}.csv` : S.view === 'week' ? `業務記録_${start}週.csv` : `業務記録_${start.slice(0, 7)}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`${list.length}件を出力しました`);
}

// =====================================================================
//  初期セットアップ（config/app が無いとき、管理者のみ）
// =====================================================================
function showSetup() {
  const rows = INITIAL_MEMBERS.map((m, i) => `<tr>
    <td><input type="text" name="name" value="${esc(m.name)}" maxlength="30"></td>
    <td><input type="email" name="email" value="${i === 0 ? esc(S.email) : ''}" ${i === 0 ? 'readonly' : ''} placeholder="未定なら空欄"></td>
    <td style="text-align:center"><input type="checkbox" name="admin" ${m.isAdmin || i === 0 ? 'checked' : ''} ${i === 0 ? 'disabled' : ''}></td></tr>`).join('');
  const sl = DEFAULT_SLOTS;
  showScreen(`<div class="setup"><h2>初期セットアップ</h2>
    <p>最初の管理者（${esc(S.email)}）としてログインしています。初期メンバーのメールアドレスを入力してください。<br><span class="muted">空欄のメンバーは後から設定画面で登録できます（それまではログインできません）。</span></p>
    <form id="setupForm" novalidate><table class="tbl"><thead><tr><th>表示名</th><th>メールアドレス</th><th style="width:4.5rem">管理者</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">時間帯：午前 ${fmtTime(sl.am.start)}〜${fmtTime(sl.am.end)}／昼休み ${fmtTime(sl.lunch.start)}〜${fmtTime(sl.lunch.end)}／午後 ${fmtTime(sl.pm.start)}〜${fmtTime(sl.pm.end)}（後から設定画面で変更できます）</p>
    <p class="error"></p><p><button type="submit" class="primary">初期データを作成</button> <button type="button" data-act="logout">ログアウト</button></p></form></div>`);
  const f = $('#setupForm');
  f.addEventListener('submit', e => { e.preventDefault(); guarded(f, () => runSetup(f)); });
}
async function runSetup(f) {
  const rows = $$('tbody tr', f).map((tr, i) => ({ name: $('[name=name]', tr).value.trim(), email: $('[name=email]', tr).value.trim().toLowerCase(), isAdmin: i === 0 || $('[name=admin]', tr).checked }))
    .filter((r, i) => i === 0 || r.name);
  if (!rows[0].name) throw new UserError('1行目（ご自身）の表示名を入力してください');
  for (const r of rows) if (r.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) throw new UserError(`${r.name} のメールアドレスの形式が正しくありません`);
  const emails = rows.map(r => r.email).filter(Boolean);
  if (new Set(emails).size !== emails.length) throw new UserError('同じメールアドレスが重複しています');
  const ops = [{ type: 'set', ref: cfgRef(), data: { slots: DEFAULT_SLOTS, categories: DEFAULT_CATEGORIES, companyHolidays: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedBy: S.user.email } }];
  rows.forEach((r, i) => {
    const ref = doc(collection(db, 'members'));
    ops.push({ type: 'set', ref, data: { name: r.name, email: r.email, color: MEMBER_COLORS[i % MEMBER_COLORS.length], order: i + 1, role: r.isAdmin ? 'admin' : 'member', active: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() } });
    if (r.email) ops.push({ type: 'set', ref: doc(db, 'allowedUsers', r.email), data: { memberId: ref.id, role: r.isAdmin ? 'admin' : 'member', name: r.name } });
  });
  S.allowed = { ...S.allowed, name: rows[0].name };
  await commitOps(ops, { action: 'create', entity: 'config', summary: `初期セットアップ：${rows.map(r => r.name).join('・')}` });
  await handleAuth(auth.currentUser);
  return true;
}

// ---------- トースト ----------
let toastTimer;
function toast(msg, type = 'info') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, type === 'error' ? 6000 : 3000);
}
</script>
