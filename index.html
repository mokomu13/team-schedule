<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開発チーム業務記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#f2f4f7; --surface:#fff; --surface2:#f7f8fa; --border:#d6dbe2; --border-strong:#aeb7c3;
  --text:#1e2833; --muted:#5d6876; --primary:#2c5a85; --primary-weak:#e4edf6; --danger:#b03a3a;
  --sat:#edf3fa; --sun:#fbeeee; --sat-text:#2c5a85; --sun-text:#b03a3a; --today:#fff4cc;
  --sel:rgba(44,90,133,.22); --warn:#9a6a00; --warn-bg:#fff4d6;
  --dw:96px; --sw:44px;
  font-size:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"BIZ UDPGothic","Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.5}
[hidden]{display:none!important}
button{font:inherit;font-size:.95rem;padding:.38rem .8rem;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--primary-weak)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:#244b6f}
button.danger{color:var(--danger);border-color:#d9a3a3}
button.ghost{border-color:transparent;background:transparent}
button.small{font-size:.85rem;padding:.2rem .55rem}
button.active{background:var(--primary);border-color:var(--primary);color:#fff}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select{font:inherit;font-size:1rem;padding:.35rem .5rem;border:1px solid var(--border-strong);border-radius:6px;background:#fff;color:var(--text);max-width:100%}
input[type=text],input[type=email],input[type=password]{width:100%}
input[type=color]{width:2.6rem;height:2rem;padding:0;border:1px solid var(--border-strong);border-radius:4px;background:#fff}
label.inline{display:inline-flex;align-items:center;gap:.3rem;margin-right:.9rem;white-space:nowrap;cursor:pointer}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:.25rem 0}
.error{color:var(--danger);font-weight:700;min-height:1.2em;margin:.4rem 0}
.spacer{flex:1}
.badge{display:inline-block;font-size:.75rem;padding:.05rem .45rem;border-radius:999px;background:var(--primary-weak);color:var(--primary);margin-left:.35rem;white-space:nowrap}
.badge.gray{background:#e8eaed;color:#5d6876}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:#e3f2ea;color:#2e6b4a}

/* ヘッダー */
.app-header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--border)}
.app-header h1{font-size:1.2rem;margin:0;color:var(--primary)}
.tabs{display:flex;gap:.3rem}
.header-actions{display:flex;align-items:center;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.user{color:var(--muted);font-size:.9rem;margin-left:.4rem}
button.filter-on{border-color:var(--primary);color:var(--primary);font-weight:700}

/* 絞り込み */
.popover{position:absolute;right:1rem;top:3.4rem;z-index:50;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:1rem;width:min(420px,calc(100vw - 2rem))}
.popover h4{margin:.2rem 0 .4rem;font-size:.95rem}
.popover .opts{display:flex;flex-wrap:wrap;gap:.2rem 0;margin-bottom:.6rem}
.popover .foot{display:flex;gap:.5rem;justify-content:flex-end;border-top:1px solid var(--border);padding-top:.6rem}

/* サマリー */
.summary{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(260px,1.1fr) minmax(260px,1.1fr);gap:.8rem;padding:.8rem 1rem 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.6rem .9rem}
.card h3{font-size:.95rem;margin:0 0 .35rem;color:var(--primary)}
.card summary{cursor:pointer;font-size:.95rem;font-weight:700;color:var(--primary)}
.abs-list{display:flex;flex-wrap:wrap;gap:.3rem .9rem}
.abs-item{border-left:4px solid var(--c);padding-left:.4rem}
button.linklike{border:none;background:none;padding:0;color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:2px;font-size:.95rem}
button.linklike:hover{background:none;color:#1d3f61}
.st-line{margin:.15rem 0 .45rem}
.st-miss{color:var(--danger);font-size:.92rem}
.st-ok{color:#2e6b4a;font-size:.92rem}
.ab-list{max-height:7.5rem;overflow:auto}
.ab-line{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;padding:.1rem 0}
.notice{grid-column:1/-1;background:var(--warn-bg);border:1px solid #ecd28c;border-radius:8px;padding:.45rem .9rem;color:var(--warn);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}

/* 凡例 */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;padding:.6rem 1rem 0}
.legend-item{border:1px solid var(--border);border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);font-size:.85rem;padding:.12rem .55rem}
.legend-item.off{opacity:.4;text-decoration:line-through}
.legend .slot-info{margin-left:auto;color:var(--muted);font-size:.85rem}

/* ツールバー */
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;padding:.6rem 1rem}
.toolbar .nav{display:flex;align-items:center;gap:.4rem}
.toolbar h2{font-size:1.2rem;margin:0 .5rem;min-width:9rem;text-align:center}
.toolbar .tb-right{margin-left:auto;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.print-only{display:none}
main#view{padding:0 1rem 1.5rem}

/* カレンダー共通 */
.grid-wrap{overflow:auto;max-height:calc(100vh - 250px);min-height:320px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;user-select:none;-webkit-user-select:none}
.grid th,.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:2px 4px;vertical-align:top;background-clip:padding-box}
.grid thead th{position:sticky;top:0;background:var(--surface2);z-index:3;font-weight:700;font-size:.95rem;text-align:center;vertical-align:middle;padding:.35rem .25rem}
.grid th.c-member,.grid th.c-name{border-top:4px solid var(--mc)}
.grid td.cell{cursor:cell;background:var(--surface)}
.grid td.cell:hover{box-shadow:inset 0 0 0 2px rgba(44,90,133,.28)}
.grid td.cell.sel{background:var(--sel)!important}
body.readonly .grid td.cell,.grid td.cell.ro{cursor:default}
.grid td.cell.ro:hover{box-shadow:none}
/* 自分の行（月表示は列の見出し）を薄く強調する */
.week tr.mine > th.c-name,.day tr.mine > th.c-name,.month th.c-member.mine{background:color-mix(in srgb,var(--mc) 16%,var(--surface2))}
.week tr.mine > td.cell:not(.sat):not(.sun):not(.today),.day tr.mine > td.cell{background:color-mix(in srgb,var(--primary) 5%,var(--surface))}
.me-tag{display:inline-block;margin-left:.35em;font-size:.68rem;font-weight:700;color:#fff;background:var(--mc,var(--primary));border-radius:3px;padding:0 .3em;vertical-align:1px}
body.readonly .grid td.cell:hover{box-shadow:none}
.badge.view-only{background:#e8eaed;color:#3d4753;font-weight:700}
.hol{display:block;font-size:.72rem;color:var(--sun-text);font-weight:400;line-height:1.2}

/* 記録チップ */
.chip{display:block;margin:2px 0;padding:1px 6px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:3px;font-size:.88rem;line-height:1.35;cursor:pointer;word-break:break-all;color:var(--text)}
.chip:hover{background:color-mix(in srgb,var(--c) 26%,#fff)}
.chip.allday{background:color-mix(in srgb,var(--c) 24%,#fff)}
.chip .cat-tag{font-size:.75em;color:var(--muted);margin-right:.25em}
.chip .slot-tag{font-size:.75em;color:var(--c);margin-right:.3em}
.chip .loc{font-size:.78em;color:var(--muted);margin-left:.3em}
.chip .rep{font-size:.78em;color:var(--muted);margin-left:.3em}
/* 明日以降の項目（予定）は点線で区別する */
.chip.plan{background:#fff;border:1px dashed var(--c);border-left:4px dashed var(--c)}
.chip .plan-tag{font-size:.7em;border:1px solid var(--c);color:var(--c);border-radius:3px;padding:0 .25em;margin-right:.3em;vertical-align:1px}
/* 過去の平日で記録がない枠 */
.week td.cell.unrec{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px)}
.week td.cell.unrec::before{content:'未記録';color:#9aa3ae;font-size:.72rem}
.unrec-label{color:#9aa3ae;font-size:.85rem}

/* 月表示 */
.month{min-width:calc(var(--dw) + var(--sw) + var(--cols) * 140px)}
.month th.c-date,.month td.c-date{position:sticky;left:0;width:var(--dw);z-index:2;background:var(--surface);text-align:center;vertical-align:middle;font-weight:700}
.month th.c-slot,.month td.c-slot{position:sticky;left:var(--dw);width:var(--sw);z-index:2;background:var(--surface);text-align:center;vertical-align:middle;font-size:.8rem;color:var(--muted)}
.month thead th.c-date,.month thead th.c-slot{z-index:4}
.month td.c-date{border-bottom:2px solid var(--border-strong)}
.month tr.am > td.cell,.month tr.am > td.c-slot{border-bottom:1px dashed var(--border)}
.month tr.pm > td{border-bottom:2px solid var(--border-strong)}
.month td.cell{height:32px}
.month tr.sat > td{background:var(--sat)} .month tr.sun > td{background:var(--sun)}
.month tr.sat > td.c-date{color:var(--sat-text)} .month tr.sun > td.c-date{color:var(--sun-text)}
.month tr.today > td{background:var(--today)}
.month tr.today > td.c-date{box-shadow:inset 5px 0 0 var(--primary)}

/* 週表示 */
.week{min-width:calc(100px + var(--days) * 2 * 84px)}
.week th.c-name{position:sticky;left:0;width:100px;z-index:2;background:var(--surface2);text-align:left;vertical-align:middle;padding:.3rem .5rem}
.week thead th.c-name{z-index:5;border-top:none}
.week thead tr:first-child th{height:3rem}
.week thead tr.sub th{top:3rem;font-size:.8rem;color:var(--muted);font-weight:400;padding:.15rem}
.week thead th.sat{background:var(--sat);color:var(--sat-text)} .week thead th.sun{background:var(--sun);color:var(--sun-text)}
.week thead th.today{background:var(--today)}
/* 週表示：1件1行・最大3件（コンパクトは2件）＋「＋○件」。行の高さが件数で大きく変わらないよう固定 */
.week td.cell{height:86px;padding:2px 3px}
.week.compact td.cell{height:56px;padding:1px 3px}
.week .chip.compact{font-size:12px;line-height:1.45;padding:0 4px 0 5px;margin:0 0 2px;border-left-width:3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week.compact .chip.compact{line-height:1.3;margin-bottom:1px}
.week .chip.compact.plan{border-width:1px;border-left-width:3px}
.week .chip .cat-tag,.week .chip-extra{display:none}
.week .more{display:block;width:100%;text-align:left;font-size:12px;line-height:1.4;padding:0 4px;border:none;border-radius:2px;background:none;color:var(--primary);font-weight:700}
.week .more:hover{background:var(--primary-weak)}
.seg{display:inline-flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
#cellPop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:.45rem .6rem .6rem;width:min(340px,calc(100vw - 16px));max-height:60vh;overflow:auto}
#cellPop .pop-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.9rem;margin-bottom:.3rem}
#cellPop .pop-head button{font-size:1.1rem;padding:0 .4rem}
.week td.cell.am{border-right:1px dashed var(--border)}
.week td.cell.pm{border-right:1px solid var(--border-strong)}
.week td.cell.sat{background:var(--sat)} .week td.cell.sun{background:var(--sun)} .week td.cell.today{background:var(--today)}

/* 日別表示 */
.day{min-width:560px}
.day th.c-name{position:sticky;left:0;width:120px;z-index:2;background:var(--surface2);text-align:left;vertical-align:middle;padding:.45rem .6rem;border-left:5px solid var(--mc);border-top:none}
.day thead th.c-name{z-index:5;border-left:none}
.day td.cell{padding:4px 6px;height:auto}
.day td.cell .cell-body{min-height:40px}
.day .chip{font-size:.95rem;padding:2px 8px}
.toolbar .rec-count{font-size:.95rem}
.hol.hol-inline{display:inline;font-size:.8rem}

/* ダイアログ */
dialog{border:none;border-radius:10px;padding:0;width:min(680px,96vw);max-height:94vh;box-shadow:0 10px 40px rgba(0,0,0,.25);color:var(--text)}
dialog::backdrop{background:rgba(20,30,40,.4)}
.form{padding:1.1rem 1.3rem}
.form h3{margin:0 0 .6rem;font-size:1.15rem;color:var(--primary)}
.row{display:grid;grid-template-columns:7rem 1fr;gap:.6rem;align-items:start;margin:.55rem 0}
.row > label{font-weight:700;padding-top:.35rem;font-size:.95rem}
.fld{min-width:0}
.actions{display:flex;gap:.5rem;align-items:center;margin-top:.8rem;border-top:1px solid var(--border);padding-top:.8rem}
.meta{font-size:.8rem;color:var(--muted);margin:.4rem 0 0}
.cat-select,.member-select{display:flex;flex-wrap:wrap;gap:.35rem}
.cat-opt input,.mem-opt input{position:absolute;opacity:0;pointer-events:none}
.cat-opt span,.mem-opt span{display:inline-block;padding:.25rem .7rem;border:1px solid var(--border-strong);border-left:6px solid var(--c,var(--mc));border-radius:5px;cursor:pointer;background:#fff;font-size:.92rem}
.cat-opt input:checked + span{background:var(--c);color:#fff;border-color:var(--c)}
.mem-opt input:checked + span{background:var(--mc);color:#fff;border-color:var(--mc)}
.cat-opt input:focus-visible + span,.mem-opt input:focus-visible + span{outline:2px solid var(--primary);outline-offset:1px}
.swatches{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.swatches button{width:1.6rem;height:1.6rem;padding:0;border-radius:4px}

/* 設定 */
.settings{background:var(--surface);border:1px solid var(--border);border-radius:8px}
.subtabs{display:flex;flex-wrap:wrap;gap:.3rem;padding:.6rem .8rem;border-bottom:1px solid var(--border);background:var(--surface2);border-radius:8px 8px 0 0}
.settings-body{padding:1rem 1.2rem}
.settings-body h3{font-size:1.05rem;margin:1rem 0 .5rem;color:var(--primary)}
.settings-body h3:first-child{margin-top:0}
.tab-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:.4rem .5rem;text-align:left;vertical-align:middle}
.tbl th{background:var(--surface2);font-weight:700}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr.warn td{background:var(--warn-bg)}
.tbl-wrap{overflow-x:auto}
.member-list{list-style:none;padding:0;margin:.6rem 0}
.member-list li{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border:1px solid var(--border);border-radius:6px;margin-bottom:.35rem;background:#fff;flex-wrap:wrap}
.member-list li.inactive{opacity:.6;background:var(--surface2)}
.drag-handle{cursor:grab;font-size:1.2rem;color:var(--muted);padding:0 .3rem;touch-action:none}
.swatch{width:1.1rem;height:1.1rem;border-radius:3px;display:inline-block}
.m-name{font-weight:700;min-width:5rem}
.m-email{color:var(--muted);font-size:.88rem}
.sortable-ghost{opacity:.4}
.diff{font-size:.85rem;color:var(--muted);margin:.2rem 0 0;padding-left:1rem}
.time-grid{display:grid;grid-template-columns:6rem auto;gap:.5rem .8rem;align-items:center;max-width:420px}

/* 全画面メッセージ */
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.screen .card{max-width:640px;width:100%;padding:1.5rem 1.8rem}
.screen h1,.screen h2{color:var(--primary);margin-top:0}
.screen button.big{font-size:1.1rem;padding:.6rem 1.4rem}
.setup table{width:100%}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#24313f;color:#fff;padding:.6rem 1.1rem;border-radius:8px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
.toast.error{background:var(--danger)}
.auth-tabs{margin:0 0 .8rem;border-radius:8px}
.auth-form .row{grid-template-columns:9rem 1fr}
.ok-msg{color:#2e6b4a;font-weight:700;margin:.4rem 0}
.ok-msg:empty{display:none}
.confidential{background:var(--warn-bg);border:1px solid #ecd28c;border-left:5px solid #d9a520;color:#6b4a00;border-radius:6px;padding:.45rem .7rem;margin:0 0 .6rem;font-size:.9rem;font-weight:700}

/* スマホ */
@media (max-width:767px){
  :root{font-size:15px;--dw:72px;--sw:34px}
  .app-header{padding:.5rem .7rem;gap:.5rem}
  .header-actions{margin-left:0;width:100%}
  .summary{grid-template-columns:1fr;padding:.6rem .7rem 0}
  .legend,.toolbar{padding-left:.7rem;padding-right:.7rem}
  main#view{padding:0 .7rem 1rem}
  .toolbar h2{min-width:0;font-size:1.05rem}
  .row{grid-template-columns:1fr;gap:.2rem}
  .row > label{padding-top:0}
  .month{min-width:calc(var(--dw) + var(--sw) + var(--cols) * 110px)}
  .legend .slot-info{margin-left:0;width:100%}
  /* 日別表示はメンバーごとに縦に並べる */
  .day{min-width:0}
  .day thead{display:none}
  .day,.day tbody,.day tr,.day th.c-name,.day td.cell{display:block;width:100%}
  .day tr{border-bottom:2px solid var(--border-strong)}
  .day th.c-name{position:static;border-right:none}
  .day td.cell{display:grid;grid-template-columns:2.8rem 1fr;gap:.4rem;border-right:none}
  .day td.cell::before{content:attr(data-label);color:var(--muted);font-size:.8rem;padding-top:.2rem}
  .day td.cell .cell-body{min-height:0}
  .toolbar input[type=date]{max-width:9.5rem}
}

/* 印刷（A4横） */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:9pt}
  .no-print,.toolbar button,.toolbar label,.toast{display:none!important}
  .print-only{display:inline}
  .toolbar{padding:0 0 2mm}
  .toolbar h2{font-size:12pt;text-align:left;margin:0}
  main#view{padding:0}
  .grid-wrap{overflow:visible;max-height:none;min-height:0;border:none}
  .grid{min-width:0!important;width:100%}
  .grid thead th,.week th.c-name,.month .c-date,.month .c-slot{position:static}
  .grid thead th{font-size:8.5pt;padding:1mm}
  .week thead tr:first-child th{height:auto}
  .week th.c-name{width:22mm;font-size:9pt}
  .week td.cell{height:auto;min-height:12mm}
  .week tbody tr{break-inside:avoid}
  .chip{font-size:8pt;padding:0 2px;border-left-width:3px;margin:1px 0}
  /* 週表示は省略せず全件・全文を表示。文字サイズは fitWeekPrint() が 9pt〜8pt で調整 */
  .week td.cell,.week.compact td.cell{height:auto;padding:.3mm .5mm}
  .week th.c-name{width:18mm}
  .week .chip.compact{font-size:var(--pf,8.5pt);line-height:1.18;white-space:normal;overflow:visible;text-overflow:clip;margin:0 0 .2mm;padding:0 .3mm 0 .8mm;border-left-width:2.5px}
  .week .chip-extra{display:block}
  .week .more{display:none}
  /* 週表示の印刷では種別名を各件に書かず、色の凡例を上部に1回だけ印刷する */
  body.print-week #legend.no-print{display:flex!important;padding:0 0 1.5mm;gap:1.2mm}
  body.print-week .legend-item{font-size:7.5pt;padding:0 1.2mm;border-left-width:2.5mm}
  body.print-week .legend .slot-info{font-size:7.5pt}
  .day th.c-name{position:static;width:28mm;font-size:10pt}
  .day .chip{font-size:9pt}
  .day td.cell .cell-body{min-height:9mm}
  .toolbar input{display:none}
  .grid td.cell:hover{box-shadow:none}
}
</style>
<style id="pageStyle">@page{size:A4 landscape;margin:8mm}</style>
</head>
<body>

<div id="app" hidden>
  <header class="app-header no-print">
    <h1 id="appTitle">開発チーム業務記録</h1>
    <nav class="tabs">
      <button data-view="week">週表示</button>

// ---------- 日付 ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addYears = (d, n) => new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7)); // 月曜始まり
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const numToYmd = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const todayStr = () => ymd(new Date());
function dateRange(from, to) { const out = []; for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)) out.push(ymd(d)); return out; }
function fmtMD(s) { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; }
function fmtYMD(s) { const d = parseYmd(s); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; }
function fmtRange(dates) { return dates.length === 1 ? fmtMD(dates[0]) : `${fmtMD(dates[0])}〜${fmtMD(dates[dates.length - 1])}`; }
function fmtTs(ts) { const d = ts?.toDate?.(); return d ? `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : ''; }
const fmtTime = s => (s || '').replace(/^0(\d)/, '$1');

// ---------- 日本の祝日（振替休日・国民の休日を含む） ----------
function nthMonday(y, m, n) { const first = new Date(y, m - 1, 1); return new Date(y, m - 1, 1 + (8 - first.getDay()) % 7 + (n - 1) * 7); }
function computeHolidays(y) {
  const h = new Map();
  const add = (m, d, name) => h.set(`${y}-${pad(m)}-${pad(d)}`, name);
  const addD = (dt, name) => h.set(ymd(dt), name);
  const eq = base => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  add(1, 1, '元日');
  addD(nthMonday(y, 1, 2), '成人の日');
  add(2, 11, '建国記念の日');
  if (y >= 2020) add(2, 23, '天皇誕生日');
  add(3, eq(20.8431), '春分の日');
  add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  if (y === 2020) { add(7, 23, '海の日'); add(7, 24, 'スポーツの日'); add(8, 10, '山の日'); }
  else if (y === 2021) { add(7, 22, '海の日'); add(7, 23, 'スポーツの日'); add(8, 8, '山の日'); }
  else { addD(nthMonday(y, 7, 3), '海の日'); add(8, 11, '山の日'); addD(nthMonday(y, 10, 2), 'スポーツの日'); }
  addD(nthMonday(y, 9, 3), '敬老の日');
  add(9, eq(23.2488), '秋分の日');
  add(11, 3, '文化の日');
  add(11, 23, '勤労感謝の日');
  for (const k of [...h.keys()].sort()) { // 国民の休日：祝日に挟まれた平日
    const mid = addDays(parseYmd(k), 1);
    if (h.has(ymd(addDays(parseYmd(k), 2))) && !h.has(ymd(mid)) && mid.getDay() !== 0) h.set(ymd(mid), '国民の休日');
  }
  for (const k of [...h.keys()].sort()) { // 振替休日：日曜の祝日の次の平日
    if (parseYmd(k).getDay() !== 0) continue;
    let n = addDays(parseYmd(k), 1);
    while (h.has(ymd(n))) n = addDays(n, 1);
    h.set(ymd(n), '振替休日');
  }
  return h;
}
const holidayCache = new Map();
function holidayName(s) {
  const y = +s.slice(0, 4);
  if (!holidayCache.has(y)) holidayCache.set(y, computeHolidays(y));
  const h = holidayCache.get(y).get(s);
  if (h) return h;
  const c = (S.config?.companyHolidays || []).find(x => x.date === s);
  return c ? (c.name || '会社休日') : '';
}
function dayKind(s) { const w = parseYmd(s).getDay(); if (w === 0 || holidayName(s)) return 'sun'; if (w === 6) return 'sat'; return ''; }

const canEdit = () => myRole() === 'admin' || myRole() === 'member';

// 管理者は全員分、メンバーは自分の記録だけ書き込める（firestore.rules の canWriteTarget / canWriteTargets と同じ判定）
const canEditTarget = targetId => isAdmin() || (canEdit() && !!myMemberId() && targetId === myMemberId());
const canEditTargets = ids => isAdmin() || (canEdit() && !!myMemberId() && ids.length === 1 && ids[0] === myMemberId());
const isViewer = () => myRole() === 'viewer';
const memberIsAdmin = m => roleOf(m) === 'admin';
const me =() => memberById(S.allowed?.memberId) || S.members.find(m => m.email === S.email);
const myName = () => me()?.name || S.allowed?.name || S.user?.displayName || S.email;

  auth = getAuth(app);

function showScreen(html) {
  $('#app').hidden = true;
  const sc = $('#screen');
  sc.hidden = false;
  sc.innerHTML = `<div class="card">${html}</div>`;
}
const logoutBtn = '<p><button data-act="logout">ログアウト</button></p>';

async function handleAuth(user) {
  stopListeners();
  if (!user) { showLogin(); return; }
  S.user = user;
  S.email = (user.email || '').toLowerCase();
  if (!user.emailVerified) { showVerify(); return; }
  showScreen('<p class="muted">読み込み中…</p>');
  let allowed = null;
  try { allowed = await getDoc(doc(db, 'allowedUsers', S.email)); } catch (e) { console.warn(e); }
  if (!allowed?.exists()) {
    showScreen(`<h2>メンバーとして登録されていません</h2><p>${esc(user.email)} はまだメンバーとして登録されていないため、記録を表示できません。<br><b>管理者に登録を依頼してください。</b></p><p class="hint">登録が済んだら、もう一度ログインしてください。</p>${logoutBtn}`);
    return;
  }
  S.allowed = allowed.data();
  let cfg;
  try { cfg = await getDoc(cfgRef()); } catch (e) { showScreen(`<h2>読み込みに失敗しました</h2><p>${esc(e.code || e.message)}</p>${logoutBtn}`); return; }
  if (!cfg.exists()) {
    if (isAdmin()) showSetup();
    else showScreen(`<h2>初期設定が完了していません</h2><p>管理者が初期設定を行うまでお待ちください。</p>${logoutBtn}`);
    return;
  }
  S.config = normalizeConfig(cfg.data());
  startApp();
}

// ---------- ログイン（メール／パスワード） ----------
const AUTH_MODES = {
  login:    { tab: 'ログイン', button: 'ログイン', desc: '社内メールアドレスと、初回登録で設定したパスワードでログインしてください。' },
  register: { tab: '初回登録', button: '登録して確認メールを送る', desc: 'はじめて使う方は、社内メールアドレスとパスワードを登録してください。登録後に確認メールが届きます。' },
  reset:    { tab: 'パスワード再設定', button: '再設定メールを送る', desc: '登録済みのメールアドレスを入力すると、パスワード再設定用のメールを送信します。' },
};
const AUTH_ERRORS = {
  'auth/invalid-credential': 'メールアドレスまたはパスワードが正しくありません',
  'auth/invalid-login-credentials': 'メールアドレスまたはパスワードが正しくありません',
  'auth/wrong-password': 'メールアドレスまたはパスワードが正しくありません',
  'auth/user-not-found': 'メールアドレスまたはパスワードが正しくありません',
  'auth/email-already-in-use': 'このメールアドレスはすでに登録されています。「ログイン」から入るか、パスワードを忘れた場合は「パスワード再設定」を使ってください',
  'auth/weak-password': 'パスワードは8文字以上で設定してください',
  'auth/password-does-not-meet-requirements': 'パスワードが要件を満たしていません',
  'auth/invalid-email': 'メールアドレスの形式が正しくありません',
  'auth/too-many-requests': '試行回数が多すぎます。しばらく待ってからやり直してください',
  'auth/network-request-failed': 'ネットワークに接続できません',
  'auth/user-disabled': 'このアカウントは無効化されています。管理者に連絡してください',
  'auth/operation-not-allowed': 'メール／パスワードでのログインが有効になっていません（Firebase の設定を確認してください）',
};
const authErrorMessage = e => AUTH_ERRORS[e.code] || '処理に失敗しました：' + (e.code || e.message);
const PASSWORD_MIN = 8;

function showLogin(mode = 'login') {
  const m = AUTH_MODES[mode];
  const pw = mode === 'reset' ? '' : `<div class="row"><label>パスワード</label><div class="fld"><input type="password" name="password" minlength="${PASSWORD_MIN}" autocomplete="${mode === 'register' ? 'new-password' : 'current-password'}" required>${mode === 'register' ? `<p class="hint">${PASSWORD_MIN}文字以上で設定してください。社内システムと同じパスワードは使わないでください。</p>` : ''}</div></div>`;
  const pw2 = mode === 'register' ? '<div class="row"><label>パスワード（確認）</label><div class="fld"><input type="password" name="password2" autocomplete="new-password" required></div></div>' : '';
  showScreen(`<h1>${esc(APP_TITLE)}</h1>
    <nav class="subtabs auth-tabs">${Object.entries(AUTH_MODES).map(([k, v]) => `<button data-act="auth-mode" data-mode="${k}" class="${k === mode ? 'active' : ''}">${v.tab}</button>`).join('')}</nav>
    <form id="authForm" class="auth-form" novalidate>
      <p class="hint">${m.desc}</p>
      <div class="row"><label>メールアドレス</label><div class="fld"><input type="email" name="email" autocomplete="username" value="${esc(S.loginEmail || '')}" required ${S.loginEmail ? '' : 'autofocus'}></div></div>
      ${pw}${pw2}
      <p class="error"></p><p class="ok-msg"></p>
      <div class="actions"><span class="spacer"></span><button type="submit" class="primary">${m.button}</button></div>
    </form>`);
  const f = $('#authForm');
  (S.loginEmail && f.elements.password ? f.elements.password : f.elements.email).focus();
  f.addEventListener('submit', e => { e.preventDefault(); guarded(f, () => authSubmit(mode, f)); });
}

async function authSubmit(mode, f) {
  const E = f.elements;
  const email = E.email.value.trim().toLowerCase(); // ルールの照合のため小文字に統一
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new UserError('メールアドレスを正しく入力してください');
  S.loginEmail = email;
  try {
    if (mode === 'reset') {
      await sendPasswordResetEmail(auth, email);
      $('.ok-msg', f).textContent = '登録済みのアドレスであれば、パスワード再設定メールを送信しました。届かない場合は迷惑メールフォルダも確認してください。';
      return;
    }
    const pw = E.password.value;
    if (pw.length < PASSWORD_MIN) throw new UserError(`パスワードは${PASSWORD_MIN}文字以上で入力してください`);
    if (mode === 'register') {
      if (pw !== E.password2.value) throw new UserError('確認用のパスワードが一致しません');
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await sendEmailVerification(cred.user);
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  } catch (e) {
    throw e instanceof UserError ? e : new UserError(authErrorMessage(e));
  }
}

function showVerify() {
  showScreen(`<h2>メールアドレスの確認</h2>
    <p>${esc(S.user.email)} 宛てに確認メールを送信しました。メール内のリンクを開いて確認を完了してから、「確認を完了した」を押してください。</p>
    <p class="hint">メールが見当たらない場合は、Outlook の「迷惑メール」フォルダを確認してください。差出人は noreply@${esc(FIREBASE_CONFIG.authDomain)} です。</p>
    <p><button class="primary" data-act="verify-check">確認を完了した</button> <button data-act="verify-resend">確認メールを再送</button> <button data-act="logout">ログアウト</button></p>`);
}
async function checkVerified() {
  const u = auth.currentUser;
  if (!u) return;
  await u.reload();
  if (!u.emailVerified) throw new UserError('まだ確認が完了していません。確認メール内のリンクを開いてください。');
  await u.getIdToken(true); // email_verified を含む新しいトークンに更新（セキュリティルールで必須）
  await handleAuth(u);
}
async function resendVerify() {
  try { await sendEmailVerification(auth.currentUser); toast('確認メールを再送しました'); }
  catch (e) { throw new UserError(authErrorMessage(e)); }
}

function onErr(e) { console.error(e); toast('データの読み込みに失敗しました：' + (e.code || e.message), 'error'); }
function listen(u) { S.unsubs.push(u); }
function stopListeners() {
  S.unsubs.forEach(u => u()); S.unsubs = [];
  S.unsubRange?.(); S.unsubRange = null; S.rangeKey = null;
}
const rangeQuery = (start, end) => query(collection(db, 'events'), where('date', '>=', start), where('date', '<=', end));
const docsOf = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

function startApp() {
  $('#screen').hidden = true;
  $('#app').hidden = false;
  S.view = innerWidth < 768 ? 'day' : 'week'; // ログイン後は PC＝週表示、スマホ＝日別
  S.cursor = new Date();
  const startRole = myRole();
  listen(onSnapshot(doc(db, 'allowedUsers', S.email), snap => {
    if (!snap.exists()) { toast('ログイン権限が取り消されました', 'error'); signOut(auth); return; }
    S.allowed = snap.data();
    if (myRole() !== startRole) { toast(`権限が「${ROLE_LABEL[myRole()]}」に変更されました`); handleAuth(S.user); return; } // 読み込み対象を切り替えるため再起動
    renderAll();
  }, onErr));
  if (isAdmin()) {
    listen(onSnapshot(collection(db, 'viewers'), snap => { S.viewers = docsOf(snap); renderAll(); }, onErr));
    checkMigration();
  }
  listen(onSnapshot(cfgRef(), snap => { if (snap.exists()) { S.config = normalizeConfig(snap.data()); holidayCache.clear(); renderAll(); } }, onErr));
  listen(onSnapshot(query(collection(db, 'members'), orderBy('order')), snap => { S.members = docsOf(snap); renderAll(); }, onErr));
  listen(onSnapshot(collection(db, 'recurrences'), snap => { S.recurrences = docsOf(snap); renderAll(); }, onErr));
  // トップの欄（今日の不在者・記録状況・今後の不在予定）用：前後2週間分
  const now = new Date();
  listen(onSnapshot(rangeQuery(ymd(addDays(now, -14)), ymd(addDays(now, ABSENCE_AHEAD_DAYS))), snap => { S.nearEvents = docsOf(snap); renderAll(); }, onErr));
  subscribeRange();
  renderAll();
}

function viewRange() {
  if (S.view === 'day') { const d = ymd(S.cursor); return { start: d, end: d }; }
  if (S.view === 'week') { const ws = startOfWeek(S.cursor); return { start: ymd(ws), end: ymd(addDays(ws, 6)) }; }
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  return { start: ymd(new Date(y, m, 1)), end: ymd(new Date(y, m + 1, 0)) };
}
function subscribeRange() {
  const { start, end } = viewRange();
  const key = start + '_' + end;
  if (key === S.rangeKey) return;
  S.rangeKey = key;
  S.unsubRange?.();
  S.events = [];
  S.unsubRange = onSnapshot(rangeQuery(start, end), snap => { S.events = docsOf(snap); renderAll(); }, onErr);
}

// =====================================================================
//  描画
// =====================================================================
// 複数のリアルタイム更新をまとめて1回だけ描画する（rAF は非表示タブで止まるため setTimeout を使う）
let renderTimer = 0;
function renderAll() { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = 0; doRender(); }, 0); }
function doRender() {
  if (!S.config || $('#app').hidden) return;
  if (S.view === 'settings' && isViewer()) S.view = 'week';
  $('#userName').innerHTML = esc(myName()) + (isAdmin() ? '（管理者）' : '') + (isViewer() ? '<span class="badge view-only">閲覧専用</span>' : '');
  $('.app-header [data-view=settings]').hidden = isViewer();
  document.body.classList.toggle('readonly', !canEdit());
  $$('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === S.view && b.closest('.app-header')));
  const f = S.filters;
  const filtering = f.hiddenCats.length || f.hiddenMembers.length || f.showInactive;
  $('#btnFilter').textContent = filtering ? '絞り込み（適用中）' : '絞り込み';
  $('#btnFilter').classList.toggle('filter-on', !!filtering);
  renderSummary();
  renderLegend();
  if (S.view === 'month') renderMonth();
  else if (S.view === 'week') renderWeek();
  else if (S.view === 'day') renderDay();
  else renderSettings();
  $('#pageStyle').textContent = `@page{size:A4 ${S.view === 'day' ? 'portrait' : 'landscape'};margin:8mm}`; // 日別はA4縦、他はA4横で印刷
  if (!$('#filterPanel').hidden) renderFilter();
}

function setViewHtml(html, key) {
  const old = $('#view .grid-wrap');
  const keep = old && S.lastViewKey === key ? { t: old.scrollTop, l: old.scrollLeft } : null;
  $('#view').innerHTML = html;
  S.lastViewKey = key;
  const nw = $('#view .grid-wrap');
  if (keep && nw) { nw.scrollTop = keep.t; nw.scrollLeft = keep.l; }
  return !keep;
}

function navHtml(title, unit, extra = '') {
  return `<div class="nav"><button data-act="prev">◀ 前${unit}</button><h2><span class="print-only">${esc(APP_TITLE)}　</span>${title}</h2><button data-act="next">翌${unit} ▶</button><button data-act="today">今日</button></div><div class="tb-right">${extra}</div>`;
}

function indexEvents(list) {
  const m = new Map();
  for (const e of list) {
    if (!passCat(e)) continue;
    const k = e.targetId + '|' + e.date;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(e);
  }
  for (const arr of m.values()) arr.sort(cmpEvent);
  return m;
}
function cmpEvent(a, b) {
  return (SLOT_RANK[a.slot] - SLOT_RANK[b.slot]) || ((catById(a.category)?.order ?? 99) - (catById(b.category)?.order ?? 99)) || (a.title || '').localeCompare(b.title || '', 'ja');
}
// 終日の記録は午前・午後の両方のセルに表示する
const cellEvents = (idx, t, d, s) => (idx.get(t + '|' + d) || []).filter(e => e.slot === s || e.slot === 'allday');

function chipHtml(e, opt = {}) {
  const c = catById(e.category);
  const color = c?.color || '#888';
  const plan = isPlanDate(e.date);
  const tip = [`${plan ? '【予定】' : ''}${e.slot === 'allday' ? '【終日】' : ''}[${c?.name || '?'}] ${e.title || ''}`, e.location && `場所：${e.location}`, e.theme && `関連テーマ：${e.theme}`,
    e.recurrenceId && '（繰り返し登録）', e.updatedByName && `更新：${e.updatedByName} ${fmtTs(e.updatedAt)}`].filter(Boolean).join('\n');
  if (opt.compact) { // 週表示用：1件1行（種別は左端の色帯で示し、全文はマウスを乗せると表示）
    const text = esc(e.title || c?.name || '');
    return `<span class="chip compact${e.slot === 'allday' ? ' allday' : ''}${plan ? ' plan' : ''}${opt.extra ? ' chip-extra' : ''}" data-ev="${e.id}" style="--c:${color}" title="${esc(tip)}"><span class="cat-tag">${esc(c?.name || '')}</span>${text}</span>`;
  }
  const slotTag = opt.slot ? `<b class="slot-tag">${SLOT_LABEL[e.slot]}</b>` : (e.slot === 'allday' ? '<b class="slot-tag">終日</b>' : '');
  const who = opt.who ? `<b>${esc(memberName(e.targetId))}</b> ` : '';
  const body = e.title ? `<span class="cat-tag">${esc(c?.name || '')}</span>${esc(e.title)}` : esc(c?.name || '');
  return `<span class="chip${e.slot === 'allday' ? ' allday' : ''}${plan ? ' plan' : ''}" data-ev="${e.id}" style="--c:${color}" title="${esc(tip)}">${plan ? '<span class="plan-tag">予定</span>' : ''}${slotTag}${who}${body}${e.location ? `<span class="loc">@${esc(e.location)}</span>` : ''}${e.recurrenceId ? '<span class="rep" title="繰り返し登録">↻</span>' : ''}</span>`;
}
// フィルタに関係なく「その枠に何か記録があるか」を判定するための集合（終日は午前・午後の両方）
function rawSlotSet(list) {
  const set = new Set();
  for (const e of list) for (const s of e.slot === 'allday' ? ['am', 'pm'] : [e.slot]) set.add(`${e.targetId}|${e.date}|${s}`);
  return set;
}
// 週表示の1マス：最大件数を超えた分は「＋○件」にまとめる（印刷時は全件を表示）
const weekMax = () => S.weekDensity === 'compact' ? 2 : 3;
function weekCellHtml(idx, t, d, s, cls) {
  const evs = cellEvents(idx, t, d, s), max = weekMax();
  const over = evs.length > max ? evs.length - max : 0;
  const chips = evs.map((e, i) => chipHtml(e, { compact: true, extra: i >= max })).join('');
  const more = over ? `<button type="button" class="more" data-act="cell-more" data-date="${d}" data-slot="${s}" data-target="${t}" title="このマスの全${evs.length}件を表示">＋${over}件</button>` : '';
  return `<td class="cell ${cls}${canEditTarget(t) ? '' : ' ro'}" data-date="${d}" data-slot="${s}" data-target="${t}">${chips}${more}</td>`;
}
const cellHtml = (idx, t, d, s, cls = '') => `<td class="cell ${cls}${canEditTarget(t) ? '' : ' ro'}" data-date="${d}" data-slot="${s}" data-target="${t}">${cellEvents(idx, t, d, s).map(e => chipHtml(e)).join('')}</td>`;
const emptyHtml = () => '<div class="card"><p class="muted">表示するメンバーがいません。絞り込み条件を確認するか、設定画面からメンバーを追加してください。</p></div>';

// ---------- サマリー（今日の不在者・記録状況・今後の不在予定） ----------
function prevBusinessDay(d) {
  let x = addDays(parseYmd(d), -1);
  for (let i = 0; i < 14 && isOffDay(ymd(x)); i++) x = addDays(x, -1);
  return ymd(x);
}
// 同じ人・種別・区分の不在が連続（間が休日だけでも可）していれば1行にまとめる
function groupAbsences(list) {
  const key = e => [e.targetId, e.category, e.slot].join('|');
  const sorted = [...list].sort((a, b) => key(a).localeCompare(key(b)) || a.date.localeCompare(b.date));
  const groups = [];
  for (const e of sorted) {
    const g = groups[groups.length - 1];
    const adjacent = g && g.key === key(e) && dateRange(ymd(addDays(parseYmd(g.to), 1)), e.date).slice(0, -1).every(isOffDay);
    if (adjacent) g.to = e.date;
    else groups.push({ key: key(e), targetId: e.targetId, category: e.category, slot: e.slot, from: e.date, to: e.date });
  }
  const order = id => memberById(id)?.order ?? 0;
  return groups.sort((a, b) => a.from.localeCompare(b.from) || order(a.targetId) - order(b.targetId));
}
function renderSummary() {
  const el = $('#summary');
  if (S.view === 'settings') { el.hidden = true; return; }
  el.hidden = false;
  const today = todayStr();
  const active = activeMembers();
  const activeIds = new Set(active.map(m => m.id));
  const absCats = new Set(S.config.categories.filter(c => c.isAbsence).map(c => c.id));

  // 今日の不在者
  const byMember = new Map();
  for (const e of S.nearEvents.filter(e => e.date === today && absCats.has(e.category) && activeIds.has(e.targetId)).sort(cmpEvent)) {
    if (!byMember.has(e.targetId)) byMember.set(e.targetId, []);
    byMember.get(e.targetId).push(e);
  }
  const absHtml = byMember.size
    ? [...byMember.entries()].sort((a, b) => byOrder(memberById(a[0]), memberById(b[0]))).map(([id, evs]) => {
        const m = memberById(id);
        return `<span class="abs-item" style="--c:${m.color}"><b>${esc(m.name)}</b>：${evs.map(e => `${esc(catName(e.category))}（${SLOT_LABEL[e.slot]}）`).join('、')}</span>`;
      }).join('')
    : '<span class="muted">なし</span>';

  // 記録状況（今日と前営業日。休暇・出張なども記録済みとして数える）
  const statusLine = (label, d) => {
    const head = `<button class="linklike" data-act="goto-day" data-date="${d}" title="日別表示で開く">${label} ${fmtMD(d)}</button>`;
    if (isOffDay(d)) return `<div class="st-line">${head} <span class="muted">休日</span></div>`;
    const done = new Set(S.nearEvents.filter(e => e.date === d).map(e => e.targetId));
    const missing = active.filter(m => !done.has(m.id));
    return `<div class="st-line">${head} 記録済み <b>${active.length - missing.length}/${active.length}</b>人
      ${missing.length ? `<div class="st-miss">未記録：${missing.map(m => esc(m.name)).join('、')}</div>` : '<div class="st-ok">全員記録済み</div>'}</div>`;
  };

  // 今後の不在予定
  const limitDay = ymd(addDays(new Date(), ABSENCE_AHEAD_DAYS));
  const ahead = groupAbsences(S.nearEvents.filter(e => e.date > today && e.date <= limitDay && absCats.has(e.category) && activeIds.has(e.targetId)));
  const aheadHtml = ahead.length
    ? ahead.map(g => `<div class="ab-line"><button class="linklike" data-act="goto-day" data-date="${g.from}">${g.from === g.to ? fmtMD(g.from) : `${fmtMD(g.from)}〜${fmtMD(g.to)}`}</button>
        <span class="abs-item" style="--c:${memberById(g.targetId).color}"><b>${esc(memberName(g.targetId))}</b> ${esc(catName(g.category))}（${SLOT_LABEL[g.slot]}）</span></div>`).join('')
    : '<span class="muted">なし</span>';

  el.innerHTML = `
    <div class="card"><h3>今日の不在者（${fmtMD(today)}）</h3><div class="abs-list">${absHtml}</div></div>
    <div class="card"><h3>記録状況</h3>${statusLine('今日', today)}${statusLine('前営業日', prevBusinessDay(today))}</div>
    <div class="card"><h3>今後の不在予定（${ABSENCE_AHEAD_DAYS}日間）</h3><div class="ab-list">${aheadHtml}</div></div>
    ${isAdmin() && needsMigration() ? `<div class="notice">旧形式の権限データ（isAdmin）が ${S.legacyAllowed.length + legacyMembers().length} 件あります。役割（role）形式への移行を実行してください。<button class="small" data-act="migrate">移行する</button></div>` : ''}`;
}

function renderLegend() {
  const el = $('#legend');
  if (S.view === 'settings') { el.hidden = true; return; }
  el.hidden = false;
  const sl = S.config.slots;
  el.innerHTML = cats().filter(c => !c.hidden).map(c =>
    `<button class="legend-item${S.filters.hiddenCats.includes(c.id) ? ' off' : ''}" data-act="toggle-cat" data-id="${c.id}" style="--c:${c.color}" title="クリックで表示／非表示を切り替え">${esc(c.name)}</button>`).join('')
    + `<span class="slot-info">午前 ${fmtTime(sl.am.start)}〜${fmtTime(sl.am.end)}　昼休み ${fmtTime(sl.lunch.start)}〜${fmtTime(sl.lunch.end)}　午後 ${fmtTime(sl.pm.start)}〜${fmtTime(sl.pm.end)}</span>`;
}

// ---------- 月表示 ----------
function renderMonth() {
  const { start, end } = viewRange();
  const cur = parseYmd(start);
  $('#toolbar').innerHTML = navHtml(`${cur.getFullYear()}年${cur.getMonth() + 1}月`, '月');
  const cols = visibleMembers();
  if (!cols.length) { setViewHtml(emptyHtml(), 'empty'); return; }
  const idx = indexEvents(S.events);
  const today = todayStr();
  let h = `<div class="grid-wrap"><table class="grid month" style="--cols:${cols.length}"><thead><tr><th class="c-date">日付</th><th class="c-slot">区分</th>${cols.map(m => `<th class="c-member${m.id === myMemberId() ? ' mine' : ''}" style="--mc:${m.color}">${esc(m.name)}${m.id === myMemberId() ? '<small class="me-tag">自分</small>' : ''}${m.active === false ? '<small class="muted">（非表示）</small>' : ''}</th>`).join('')}</tr></thead><tbody>`;
  for (const d of dateRange(start, end)) {
    const hol = holidayName(d);
    const cls = `${dayKind(d)}${d === today ? ' today' : ''}`;
    h += `<tr class="am ${cls}"${d === today ? ' id="todayRow"' : ''}><td class="c-date" rowspan="2">${fmtMD(d)}${hol ? `<small class="hol">${esc(hol)}</small>` : ''}</td><td class="c-slot">午前</td>${cols.map(m => cellHtml(idx, m.id, d, 'am')).join('')}</tr>`;
    h += `<tr class="pm ${cls}"><td class="c-slot">午後</td>${cols.map(m => cellHtml(idx, m.id, d, 'pm')).join('')}</tr>`;
  }
  h += '</tbody></table></div>';
  if (setViewHtml(h, 'month' + start)) {
    const row = $('#todayRow'), wrap = $('#view .grid-wrap');
    if (row && wrap) wrap.scrollTop = row.getBoundingClientRect().top - wrap.getBoundingClientRect().top - wrap.querySelector('thead').offsetHeight - 4;
  }
}

// ---------- 週表示 ----------
function renderWeek() {
  const ws = startOfWeek(S.cursor);
  const n = S.showWeekend ? 7 : 5;
  const days = [...Array(n)].map((_, i) => ymd(addDays(ws, i)));
  $('#toolbar').innerHTML = navHtml(`${fmtYMD(days[0])} 〜 ${fmtMD(days[n - 1])}`, '週',
    `<span class="seg" role="group" aria-label="表示密度">${[['normal', '標準'], ['compact', 'コンパクト']].map(([k, l]) => `<button data-act="density" data-d="${k}" class="${S.weekDensity === k ? 'active' : ''}">${l}</button>`).join('')}</span>`
    + `<label class="inline"><input type="checkbox" data-act="toggle-weekend" ${S.showWeekend ? 'checked' : ''}> 土日を表示</label><button data-act="print">印刷</button>`);
  const cols = visibleMembers();
  if (!cols.length) { setViewHtml(emptyHtml(), 'empty'); return; }
  const idx = indexEvents(S.events);
  const today = todayStr();
  const raw = rawSlotSet(S.events);
  // 過去の平日で、その枠に何も記録がなければ「未記録」
  const unrec = (m, d, s) => d < today && !isOffDay(d) && !raw.has(`${m}|${d}|${s}`) ? ' unrec' : '';
  let h = `<div class="grid-wrap"><table class="grid week${S.weekDensity === 'compact' ? ' compact' : ''}" style="--days:${n}"><thead><tr><th class="c-name" rowspan="2">メンバー</th>`
    + days.map(d => { const hol = holidayName(d); return `<th colspan="2" class="${dayKind(d)}${d === today ? ' today' : ''}">${fmtMD(d)}${hol ? `<small class="hol">${esc(hol)}</small>` : ''}</th>`; }).join('')
    + `</tr><tr class="sub">${days.map(d => `<th class="${dayKind(d)}">午前</th><th class="${dayKind(d)}">午後</th>`).join('')}</tr></thead><tbody>`;
  for (const m of cols) {
    h += `<tr${m.id === myMemberId() ? ' class="mine"' : ''}><th class="c-name" style="--mc:${m.color}">${esc(m.name)}${m.id === myMemberId() ? '<small class="me-tag">自分</small>' : ''}</th>${days.map(d => {
      const k = dayKind(d) + (d === today ? ' today' : '');
      return weekCellHtml(idx, m.id, d, 'am', 'am ' + k + unrec(m.id, d, 'am')) + weekCellHtml(idx, m.id, d, 'pm', 'pm ' + k + unrec(m.id, d, 'pm'));
    }).join('')}</tr>`;
  }
  h += '</tbody></table></div>';
  setViewHtml(h, 'week' + days[0] + n);
}

// ---------- 日別表示（その日、誰が何をしたか） ----------
function renderDay() {
  const d = ymd(S.cursor);
  const hol = holidayName(d);
  const today = todayStr();
  const workday = d <= today && !isOffDay(d);
  const active = activeMembers();
  const done = new Set(S.events.filter(e => e.date === d).map(e => e.targetId));
  const countHtml = workday ? `<span class="rec-count">記録済み <b>${active.filter(m => done.has(m.id)).length}/${active.length}</b>人</span>`
    : isPlanDate(d) ? '<span class="rec-count muted">先の日付（予定）</span>' : '';
  $('#toolbar').innerHTML = navHtml(`${fmtYMD(d)}${hol ? ` <small class="hol hol-inline">${esc(hol)}</small>` : ''}`, '日',
    `${countHtml}<input type="date" data-act="pick-date" value="${d}" aria-label="日付を選ぶ"><button data-act="print">印刷</button>`);
  const cols = visibleMembers();
  if (!cols.length) { setViewHtml(emptyHtml(), 'empty'); return; }
  const idx = indexEvents(S.events);
  const raw = rawSlotSet(S.events);
  const cell = (m, s, inner, extra = '') => `<td class="cell ${s}${canEditTarget(m.id) ? '' : ' ro'}"${extra} data-label="${SLOT_LABEL[s]}" data-date="${d}" data-slot="${s === 'allday' ? 'am' : s}" data-target="${m.id}"><div class="cell-body">${inner}</div></td>`;
  let h = `<div class="grid-wrap day-wrap"><table class="grid day ${dayKind(d)}"><thead><tr><th class="c-name">メンバー</th><th>午前</th><th>午後</th></tr></thead><tbody>`;
  for (const m of cols) {
    const evs = idx.get(m.id + '|' + d) || [];
    h += `<tr${m.id === myMemberId() ? ' class="mine"' : ''}><th class="c-name" style="--mc:${m.color}">${esc(m.name)}${m.id === myMemberId() ? '<small class="me-tag">自分</small>' : ''}</th>`;
    if (evs.length && evs.every(e => e.slot === 'allday')) {
      h += cell(m, 'allday', evs.map(e => chipHtml(e)).join(''), ' colspan="2"');
    } else {
      for (const s of ['am', 'pm']) {
        const chips = cellEvents(idx, m.id, d, s).map(e => chipHtml(e)).join('');
        h += cell(m, s, chips || (workday && !raw.has(`${m.id}|${d}|${s}`) ? '<span class="unrec-label">未記録</span>' : ''));
      }
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  setViewHtml(h, 'day' + d);
}

// 「＋○件」：そのマスの全件を小さなポップアップで表示する
function openCellPopover(btn) {
  const { date, slot, target } = btn.dataset;
  const evs = cellEvents(indexEvents(S.events), target, date, slot);
  const pop = $('#cellPop');
  pop.innerHTML = `<div class="pop-head"><span><b>${esc(memberName(target))}</b>　${fmtMD(date)} ${SLOT_LABEL[slot]}（${evs.length}件）</span><button type="button" class="ghost small" data-act="pop-close" aria-label="閉じる">×</button></div>
    <div class="pop-list">${evs.map(e => chipHtml(e)).join('')}</div>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  pop.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
}

// 印刷時：週表示を全件・全文で A4横1枚に収めるため、文字サイズを 9pt〜8pt の範囲で自動調整する。
// 印刷と同じ幅・文字サイズの見えない枠に各マスの内容を流し込み、実際の折り返しで高さを測る
function fitWeekPrint() {
  const tbl = $('#view table.week');
  document.body.classList.toggle('print-week', !!tbl);
  if (!tbl) return;
  const days = +tbl.style.getPropertyValue('--days') || 5;
  const cellW = (281 - 18) / (days * 2) - 1.2;  // 1マスの幅（mm）：A4横の印刷幅からメンバー列とマスの余白・枠線を引く
  const avail = 194 - 30;                      // 本文に使える高さ（mm）：タイトル・凡例・日付行を除く
  const rows = [...tbl.tBodies[0].rows].map(r => [...r.querySelectorAll('td.cell')].map(td => [...td.querySelectorAll('.chip')].map(c => ({ text: c.lastChild?.textContent || '', plan: c.classList.contains('plan') }))));
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
  document.body.appendChild(probe);
  const heightAt = pt => rows.reduce((sum, cells) => {
    let maxPx = 0;
    for (const items of cells) {
      if (!items.length) continue;
      probe.innerHTML = items.map(t => `<div style="box-sizing:border-box;width:${cellW}mm;font-size:${pt}pt;line-height:1.18;padding:0 .3mm 0 .8mm;border:${t.plan ? 1 : 0}px solid;border-left:2.5px solid;margin:0 0 .2mm;word-break:break-all">${esc(t.text) || '&nbsp;'}</div>`).join('');
      maxPx = Math.max(maxPx, probe.offsetHeight);
    }
    return sum + Math.max(maxPx / 3.7795, 4) + 1;   // px→mm、空の行も最低限の高さ＋行の余白
  }, 0);
  let pt = 9;
  while (pt > 8 && heightAt(pt) > avail) pt -= 0.25;
  probe.remove();
  tbl.style.setProperty('--pf', pt + 'pt');
}

// =====================================================================
//  セル選択（ドラッグで複数日・複数メンバー）
// =====================================================================
let sel = null, lastPointer = 'mouse';
const cellInfo = td => ({ date: td.dataset.date, slot: td.dataset.slot, target: td.dataset.target });
const linIdx = c => dayNum(c.date) * 2 + (c.slot === 'pm' ? 1 : 0);
function selBounds() {
  const order = visibleMembers().map(m => m.id);
  const t1 = order.indexOf(sel.a.target), t2 = order.indexOf(sel.b.target);
  const l1 = linIdx(sel.a), l2 = linIdx(sel.b);
  return { order, tMin: Math.min(t1, t2), tMax: Math.max(t1, t2), lMin: Math.min(l1, l2), lMax: Math.max(l1, l2) };
}
function paintSel() {
  const b = selBounds();
  $$('#view td.cell').forEach(td => {
    const c = cellInfo(td), ti = b.order.indexOf(c.target), li = linIdx(c);
    td.classList.toggle('sel', ti >= b.tMin && ti <= b.tMax && li >= b.lMin && li <= b.lMax);
  });
}
function finishSel() {
  const b = selBounds();
  sel = null;
  $$('#view td.cell.sel').forEach(td => td.classList.remove('sel'));
  const from = numToYmd(Math.floor(b.lMin / 2)), to = numToYmd(Math.floor(b.lMax / 2));
  const sSlot = b.lMin % 2 ? 'pm' : 'am', eSlot = b.lMax % 2 ? 'pm' : 'am';
  let slot;
  if (b.lMin === b.lMax) slot = sSlot;
  else if (from === to) slot = 'allday';
  else slot = sSlot === eSlot ? sSlot : 'allday';
  openEventDialog({ mode: 'new', targets: b.order.slice(b.tMin, b.tMax + 1), from, to, slot });
}

//  イベント結線
// =====================================================================
function bindGlobalEvents() {
  const view = $('#view');
  view.addEventListener('pointerdown', e => {
    lastPointer = e.pointerType;
    if (!canEdit()) return; // 閲覧者はドラッグ選択・新規登録不可
    if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.chip, .more')) return;
    const td = e.target.closest('td.cell');
    if (!td || !canEditTarget(td.dataset.target)) return; // メンバーは自分の行（列）からだけ選択できる
    e.preventDefault();
    sel = { a: cellInfo(td), b: cellInfo(td) };
    paintSel();
  });
  view.addEventListener('pointerover', e => {
    if (!sel) return;
    const td = e.target.closest('td.cell');
    if (!td) return;
    const c = cellInfo(td);
    if (!isAdmin()) c.target = sel.a.target; // 複数メンバーをまたぐ選択は管理者のみ。メンバーは日付の範囲だけ広がる
    if (c.date === sel.b.date && c.slot === sel.b.slot && c.target === sel.b.target) return;
    sel.b = c;
    paintSel();
  });
  document.addEventListener('pointerup', () => { if (sel) finishSel(); });
  view.addEventListener('click', e => { // タッチ操作はタップで1セル入力
    if (!canEdit() || lastPointer === 'mouse' || e.target.closest('.chip, .more')) return;
    const td = e.target.closest('td.cell');
    if (!td) return;
    const c = cellInfo(td);
    if (!canEditTarget(c.target)) return;
    openEventDialog({ mode: 'new', targets: [c.target], from: c.date, to: c.date, slot: c.slot });
  });

  document.addEventListener('click', e => {
    const pop = $('#cellPop');
    if (!pop.hidden && !e.target.closest('#cellPop') && !e.target.closest('.more')) pop.hidden = true;
    const chip = e.target.closest('[data-ev]');
    if (chip && !e.target.closest('dialog')) { pop.hidden = true; openEditById(chip.dataset.ev); return; }
    const v = e.target.closest('[data-view]');
    if (v) { setView(v.dataset.view); return; }
    const a = e.target.closest('[data-act]');
    if (a && !a.matches('input,select')) { handleAct(a.dataset.act, a); return; }
    const panel = $('#filterPanel');
    if (!panel.hidden && !e.target.closest('#filterPanel') && !e.target.closest('#btnFilter')) panel.hidden = true;
  });
  document.addEventListener('change', e => {
    const a = e.target.closest('[data-act]');
    if (a && a.matches('input')) handleChange(a.dataset.act, a);
  });
  $('#filterPanel').addEventListener('change', onFilterChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#cellPop').hidden = true; });
  $('#view').addEventListener('scroll', () => { $('#cellPop').hidden = true; }, true);
  window.addEventListener('beforeprint', fitWeekPrint);
  const dlg = $('#dlg');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
}

function setView(v) {
  if (v !== 'settings' && S.view !== 'settings' && v !== S.view) {
    // 表示を切り替えるとき、今日が今の表示範囲に入っていれば今日を、入っていなければ範囲の先頭を基準にする
    const { start, end } = viewRange(), t = todayStr();
    S.cursor = t >= start && t <= end ? new Date() : parseYmd(start);
  }
  S.view = v;
  if (v === 'settings' && S.settingsTab === 'history' && !S.historyLoaded) loadHistory();
  subscribeRange();
  renderAll();
}
function nav(dir) {
  if (S.view === 'day') S.cursor = addDays(S.cursor, dir);
  else if (S.view === 'week') S.cursor = addDays(S.cursor, 7 * dir);
  else S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth() + dir, 1);
  subscribeRange();
  renderAll();
}

function handleAct(act, el) {
  const id = el.dataset.id;
  switch (act) {
    case 'auth-mode': S.loginEmail = $('#authForm [name=email]')?.value.trim() || S.loginEmail; return showLogin(el.dataset.mode);
    case 'verify-check': return guardedAction(checkVerified);
    case 'verify-resend': return guardedAction(resendVerify);
    case 'logout': return signOut(auth);
    case 'prev': return nav(-1);
    case 'next': return nav(1);
    case 'today': S.cursor = new Date(); S.lastViewKey = null; subscribeRange(); return renderAll();
    case 'filter': { const p = $('#filterPanel'); p.hidden = !p.hidden; if (!p.hidden) renderFilter(); return; }
    case 'filter-reset': S.filters = { hiddenCats: [], hiddenMembers: [], showInactive: false }; saveFilters(); return renderAll();
    case 'filter-close': $('#filterPanel').hidden = true; return;
    case 'toggle-cat': {
      const f = S.filters;
      f.hiddenCats = f.hiddenCats.includes(id) ? f.hiddenCats.filter(x => x !== id) : [...f.hiddenCats, id];
      saveFilters(); return renderAll();
    }
    case 'csv': return exportCsv();
    case 'cell-more': return openCellPopover(el);
    case 'pop-close': $('#cellPop').hidden = true; return;
    case 'density': S.weekDensity = el.dataset.d; store.set('weekDensity', S.weekDensity); return renderAll();
    case 'print': return window.print();
    case 'goto-day': S.cursor = parseYmd(el.dataset.date); return setView('day');
    case 'settings-tab':
      S.settingsTab = el.dataset.tab;
      if (S.settingsTab === 'history' && !S.historyLoaded) loadHistory();
      return renderAll();
    case 'rec-stop': return guardedAction(() => stopRecurrence(S.recurrences.find(r => r.id === id)));
    case 'hist-reload': return loadHistory();
    case 'hist-del': return guardedAction(() => deleteHistory(id));
    case 'member-add': return openMemberDialog(null);
    case 'member-edit': return openMemberDialog(memberById(id));
    case 'migrate': return guardedAction(runMigration);
    case 'viewer-add': return openViewerDialog(null);
    case 'viewer-edit': return openViewerDialog(S.viewers.find(v => v.id === id));
    case 'viewer-del': return guardedAction(() => deleteViewer(S.viewers.find(v => v.id === id)));
    case 'member-toggle': return guardedAction(() => toggleMemberActive(memberById(id)));
    case 'cat-add': return addCatRow();
    case 'hol-del': return guardedAction(() => removeCompanyHoliday(el.dataset.date));
  }
}
function handleChange(act, el) {
  if (act === 'pick-date') { if (el.value) { S.cursor = parseYmd(el.value); subscribeRange(); renderAll(); } }
  else if (act === 'toggle-weekend') { S.showWeekend = el.checked; store.set('showWeekend', S.showWeekend); renderAll(); }
  else if (act === 'toggle-inactive-settings') { S.showInactiveSettings = el.checked; renderAll(); }
}

// ---------- 絞り込み ----------
function renderFilter() {
  const f = S.filters;
  const ms = S.members.filter(m => m.active !== false || f.showInactive).sort(byOrder);
  $('#filterPanel').innerHTML = `
    <h4>種別</h4><div class="opts">${cats().map(c => `<label class="inline"><input type="checkbox" data-f="cat" value="${c.id}" ${f.hiddenCats.includes(c.id) ? '' : 'checked'}> <span class="swatch" style="background:${c.color}"></span>${esc(c.name)}</label>`).join('')}</div>
    <h4>メンバー</h4><div class="opts">${ms.map(m => `<label class="inline"><input type="checkbox" data-f="member" value="${m.id}" ${f.hiddenMembers.includes(m.id) ? '' : 'checked'}> ${esc(m.name)}${m.active === false ? '（非表示）' : ''}</label>`).join('')}</div>
    <div class="opts"><label class="inline"><input type="checkbox" data-f="inactive" ${f.showInactive ? 'checked' : ''}> 非表示のメンバーも表示する（過去の記録の確認用）</label></div>
    <div class="foot"><button data-act="filter-reset">すべて表示</button><button class="primary" data-act="filter-close">閉じる</button></div>`;

function onFilterChange(e) {
  const i = e.target, f = S.filters;
  const toggle = (arr, v, show) => show ? arr.filter(x => x !== v) : [...new Set([...arr, v])];
  if (i.dataset.f === 'cat') f.hiddenCats = toggle(f.hiddenCats, i.value, i.checked);
  else if (i.dataset.f === 'member') f.hiddenMembers = toggle(f.hiddenMembers, i.value, i.checked);
  else if (i.dataset.f === 'inactive') f.showInactive = i.checked;
  saveFilters();
  renderAll();
}

function openDialog(html) {
  const d = $('#dlg');
  d.innerHTML = html;
  $$('[data-close]', d).forEach(b => b.addEventListener('click', () => d.close()));
  if (!d.open) d.showModal();
  $('[autofocus]', d)?.focus();
}
async function guarded(form, fn) {
  const btns = $$('button', form);
  btns.forEach(b => b.disabled = true);
  const err = $('.error', form);
  if (err) err.textContent = '';
  try {
    const ok = await fn();
    if (ok && $('#dlg').open && $('#dlg').contains(form)) $('#dlg').close();
  } catch (e) {
    if (!(e instanceof UserError)) console.error(e);
    const msg = e instanceof UserError ? e.message : '保存に失敗しました：' + (e.code || e.message);
    if (err) err.textContent = msg; else toast(msg, 'error');
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
async function guardedAction(fn) {
  try { await fn(); }
  catch (e) { if (!(e instanceof UserError)) console.error(e); toast(e instanceof UserError ? e.message : '処理に失敗しました：' + (e.code || e.message), 'error'); }
}

// 書き込みをバッチにまとめて実行（500件制限のため450件ずつ）。履歴は最初のバッチに含める
async function commitOps(ops, hist) {
  const CHUNK = 450;
  for (let i = 0; i < Math.max(ops.length, 1); i += CHUNK) {
    const b = writeBatch(db);
    if (i === 0 && hist) addHistory(b, hist);
    for (const op of ops.slice(i, i + CHUNK)) {
      if (op.type === 'set') op.merge ? b.set(op.ref, op.data, { merge: true }) : b.set(op.ref, op.data);
      else if (op.type === 'update') b.update(op.ref, op.data);
      else b.delete(op.ref);
    }
    await b.commit();
  }
}
const HIST_SKIP = ['id', 'createdAt', 'updatedAt', 'createdBy', 'createdByName', 'updatedBy', 'updatedByName'];
const cleanForHist = o => o == null ? null : Object.fromEntries(Object.entries(o).filter(([k, v]) => v !== undefined && !HIST_SKIP.includes(k)));
function addHistory(b, h) {
  b.set(doc(collection(db, 'history')), {
    action: h.action, entity: h.entity, summary: h.summary,
    docIds: (h.docIds || []).slice(0, 100),
    before: cleanForHist(h.before), after: cleanForHist(h.after),
    byEmail: S.user.email, byName: myName(), at: serverTimestamp(),
  });
}

    ${scopeHtml}${meta}
    <p class="error"></p>
    <div class="actions">${isNew ? '' : '<button type="button" class="danger" id="evDelete">削除</button>'}<span class="spacer"></span><button type="button" data-close>キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>`);

  const f = $('#evForm'), E = f.elements;
  // 選んだ日付に合わせて見出しを切り替える（今日以前＝実施記録、明日以降＝予定）
  const updHeading = () => {
    const from = isNew ? E.from.value : E.date.value, to = isNew ? E.to.value : E.date.value;
    const kind = !from ? 'rec' : isPlanDate(from) ? 'plan' : (to && isPlanDate(to)) ? 'mixed' : 'rec';
    $('#evHeading').textContent = { rec: '実施記録', plan: '予定（出張・休暇など）', mixed: '実施記録・予定' }[kind] + (isNew ? 'の登録' : 'の編集');
    $('#lblTitle').textContent = kind === 'plan' ? '内容' : '実施内容';
  };
  updHeading();
  (isNew ? [E.from, E.to] : [E.date]).forEach(i => i.addEventListener('change', updHeading));
  if (groupType) {
    const upd = () => { const all = E.scope.value !== 'one'; E.date.disabled = all; E.target.disabled = all; };
    $$('[name=scope]', f).forEach(r => r.addEventListener('change', upd));
  }
  f.addEventListener('submit', e => { e.preventDefault(); guarded(f, () => isNew ? saveNewEvents(f) : saveEditEvent(f, ev, groupType, rec)); });
  $('#evDelete')?.addEventListener('click', () => guarded(f, () => deleteEvent(f, ev, groupType, rec)));
}

function readEvFields(E) {
  const fields = { slot: E.slot.value, category: E.category.value, title: E.title.value.trim(), location: E.location.value, theme: E.theme.value.trim() };
  if (!fields.slot) throw new UserError('区分を選んでください');
  if (!fields.category) throw new UserError('種別を選んでください');
  return fields;
}
const maxEndFrom = from => ymd(addDays(addYears(parseYmd(from), 1), -1));

// 繰り返し登録は廃止（日付が過ぎると、実施していない内容まで実施記録として残るため）。まとめて登録は残す
async function saveNewEvents(f) {
  const E = f.elements;
  const targets = $$('[name=targets]:checked', f).map(i => i.value);
  const from = E.from.value, to = E.to.value;
  if (!targets.length) throw new UserError('対象のメンバーを選んでください');
  if (!from || !to) throw new UserError('期間を入力してください');
  if (to < from) throw new UserError('終了日は開始日以降にしてください');
  const fields = readEvFields(E);
  const maxEnd = maxEndFrom(from);
  if (to > maxEnd) throw new UserError(`期間は最長1年です（${fmtYMD(maxEnd)} まで）`);

  const dates = dateRange(from, to).filter(d => !(E.excludeOff.checked && isOffDay(d)));
  if (!dates.length) throw new UserError('対象となる日がありません（「土日・祝日を除く」の設定を確認してください）');
  const total = dates.length * targets.length;
  if (total > BULK_CONFIRM && !confirm(`${total}件を登録します。よろしいですか？`)) return false;
  const batchId = total > 1 ? doc(collection(db, 'events')).id : null;
  const ops = [], ids = [];
  for (const t of targets) for (const d of dates) {
    const ref = doc(collection(db, 'events'));
    ids.push(ref.id);
    ops.push({ type: 'set', ref, data: { date: d, targetType: 'member', targetId: t, ...fields, batchId, recurrenceId: null, ...stampNew() } });
  }
  const summary = `${kindLabel(from, to)}を登録：${targets.map(memberName).join('・')} ${fmtRange(dates)} ${SLOT_LABEL[fields.slot]} [${catName(fields.category)}] ${fields.title}　${total}件`;
  await commitOps(ops, { action: 'create', entity: 'event', summary, docIds: ids, after: { ...fields, targets: targets.map(memberName), from, to } });
  toast(`${total}件を登録しました`);
  return true;
}

async function groupEvents(ev, scope) {
  const field = scope === 'future' ? 'recurrenceId' : 'batchId';
  const snap = await getDocs(query(collection(db, 'events'), where(field, '==', ev[field])));
  // メンバーは、管理者がまとめて登録したグループのうち自分の記録だけを対象にする
  const list = docsOf(snap).filter(x => canEditTarget(x.targetId));
  return scope === 'future' ? list.filter(x => x.date >= ev.date) : list;
}

async function saveEditEvent(f, ev, groupType, rec) {
  const E = f.elements;
  const scope = groupType ? E.scope.value : 'one';
  const fields = readEvFields(E);
  if (scope === 'one') {
    if (!E.date.value) throw new UserError('日付を入力してください');
    const after = { ...fields, date: E.date.value, targetId: E.target.value };
    await commitOps([{ type: 'update', ref: doc(db, 'events', ev.id), data: { ...after, ...stampUpd() } }],
      { action: 'update', entity: 'event', summary: `${kindLabel(after.date)}を変更：` + describeEv({ ...ev, ...after }), docIds: [ev.id], before: pickEv(ev), after: pickEv({ ...ev, ...after }) });
    toast('更新しました');
    return true;
  }
  const list = await groupEvents(ev, scope);
  const ops = list.map(x => ({ type: 'update', ref: doc(db, 'events', x.id), data: { ...fields, ...stampUpd() } }));
  if (scope === 'future' && rec && canEditTargets(rec.targetIds)) ops.push({ type: 'update', ref: doc(db, 'recurrences', rec.id), data: { ...fields, ...stampUpd() } });
  const before = { slot: ev.slot, category: ev.category, title: ev.title, location: ev.location, theme: ev.theme };
  await commitOps(ops, { action: 'update', entity: 'event', summary: `記録を一括変更（${scope === 'future' ? 'この日以降の繰り返し' : 'グループ'} ${list.length}件）：${describeEv({ ...ev, ...fields })}`, docIds: list.map(x => x.id), before, after: fields });
  toast(`${list.length}件を更新しました`);
  return true;
}

async function deleteEvent(f, ev, groupType, rec) {
  const scope = groupType ? f.elements.scope.value : 'one';
  if (scope === 'one') {
    if (!confirm(`この${kindLabel(ev.date)}を削除しますか？`)) return false;
    await commitOps([{ type: 'delete', ref: doc(db, 'events', ev.id) }], { action: 'delete', entity: 'event', summary: `${kindLabel(ev.date)}を削除：` + describeEv(ev), docIds: [ev.id], before: pickEv(ev) });
    toast('削除しました');
    return true;
  }
  const list = await groupEvents(ev, scope);
  if (!confirm(`${list.length}件を削除しますか？`)) return false;
  const ops = list.map(x => ({ type: 'delete', ref: doc(db, 'events', x.id) }));
  if (scope === 'future' && rec && canEditTargets(rec.targetIds)) {
    if (ev.date <= rec.startDate) ops.push({ type: 'delete', ref: doc(db, 'recurrences', rec.id) });
    else ops.push({ type: 'update', ref: doc(db, 'recurrences', rec.id), data: { endDate: ymd(addDays(parseYmd(ev.date), -1)), ...stampUpd() } });
  }
  await commitOps(ops, { action: 'delete', entity: 'event', summary: `記録を一括削除（${list.length}件）：${describeEv(ev)}`, docIds: list.map(x => x.id), before: pickEv(ev) });
  toast(`${list.length}件を削除しました`);
  return true;
}

// =====================================================================
//  繰り返し登録（旧機能）の終了。新規作成・延長は廃止
// =====================================================================
async function stopRecurrence(r) {
  if (!r) return;
  if (!canEditTargets(r.targetIds)) throw new UserError('他のメンバーを含む繰り返し登録は、管理者のみ終了できます');
  const today = todayStr();
  if (!confirm(`この繰り返し登録を終了し、今日（${fmtMD(today)}）以降に作られている分を削除しますか？\n今日より前の記録は残ります。`)) return;
  const list = docsOf(await getDocs(query(collection(db, 'events'), where('recurrenceId', '==', r.id)))).filter(x => x.date >= today);
  const ops = list.map(x => ({ type: 'delete', ref: doc(db, 'events', x.id) }));
  if (r.startDate >= today) ops.push({ type: 'delete', ref: doc(db, 'recurrences', r.id) });
  else ops.push({ type: 'update', ref: doc(db, 'recurrences', r.id), data: { endDate: ymd(addDays(parseYmd(today), -1)), ...stampUpd() } });
  await commitOps(ops, { action: 'delete', entity: 'recurrence', summary: `繰り返し登録を終了：${r.targetIds.map(memberName).join('・')} ${recDesc(r)} [${catName(r.category)}] ${r.title || ''}（${list.length}件削除）`, docIds: [r.id], before: { endDate: r.endDate } });
  toast('繰り返し登録を終了しました');
}

function settingsHistory() {

    <p class="hint">直近300件を表示しています。${isAdmin() ? '誤って社外秘情報が記録された場合は、その行の「削除」で消去できます（記録そのものも忘れずに修正してください）。' : ''}</p><div id="histList">${S.historyLoaded ? '' : '<p class="muted">読み込み中…</p>'}</div>`;
}
const ACTION_LABEL = { create: '追加', update: '変更', delete: '削除', purge: '履歴削除' };
const FIELD_LABEL = { date: '日付', targetId: '対象', slot: '区分', category: '種別', title: '内容', location: '場所', theme: '関連テーマ', name: '表示名', email: 'メール', color: '色', isAdmin: '管理者', role: '役割', active: '表示', endDate: '終了日', slots: '時間帯', categories: '種別', companyHolidays: '会社休日', order: '表示順' };
function fmtVal(k, v) {
  if (v == null || v === '') return '（なし）';
  if (k === 'targetId') return memberName(v);
  if (k === 'slot') return SLOT_LABEL[v] || v;
  if (k === 'category') return catName(v);
  if (typeof v === 'boolean') return v ? 'はい' : 'いいえ';
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' ? (x.name || x.date || JSON.stringify(x)) : x).join('、');
  if (typeof v === 'object') return Object.entries(v).map(([a, b]) => `${a}:${typeof b === 'object' ? Object.values(b).join('〜') : b}`).join(' ');
  return String(v);
}
function diffHtml(h) {
  if (!h.before || !h.after) return '';
  const keys = [...new Set([...Object.keys(h.before), ...Object.keys(h.after)])].filter(k => JSON.stringify(h.before[k]) !== JSON.stringify(h.after[k]));
  return keys.length ? `<ul class="diff">${keys.map(k => `<li>${esc(FIELD_LABEL[k] || k)}：${esc(fmtVal(k, h.before[k]))} → ${esc(fmtVal(k, h.after[k]))}</li>`).join('')}</ul>` : '';
}
function renderHistoryList() {

    `<tr><td>${fmtTs(h.at)}</td><td>${esc(h.byName || h.byEmail)}</td><td><span class="badge ${h.action === 'delete' || h.action === 'purge' ? 'warn' : ''}">${ACTION_LABEL[h.action] || h.action}</span></td><td>${esc(h.summary)}${diffHtml(h)}</td>`
    + (admin ? `<td class="act">${h.action === 'purge' ? '' : `<button class="small danger" data-act="hist-del" data-id="${h.id}" title="誤って社外秘情報を記入した場合の消去用">削除</button>`}</td>` : '') + '</tr>').join('')}</tbody></table></div>`
    : '<p class="muted">該当する履歴はありません。</p>';
}

async function saveMemberOrder() {
